services:
  hydra:
    image: oryd/hydra:v26.2.0
    container_name: idnest-hydra
    restart: unless-stopped
    env_file:
      - ${IDNEST_ENV_FILE:-/etc/idnest/idnest.env}
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      LOG_LEVEL: error
      SERVE_PUBLIC_CORS_ENABLED: 'true'
      SERVE_PUBLIC_CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS
      SERVE_PUBLIC_CORS_ALLOWED_HEADERS: Authorization,Content-Type,Accept
      SERVE_PUBLIC_CORS_ALLOW_CREDENTIALS: 'true'
      SERVE_COOKIES_SAME_SITE_MODE: Lax
      SERVE_COOKIES_SAME_SITE_LEGACY_WORKAROUND: 'false'
      SERVE_COOKIES_SECURE: 'true'
      WEBFINGER_OIDC_DISCOVERY_SUPPORTED_SCOPES: openid,profile,email
      WEBFINGER_OIDC_DISCOVERY_SUPPORTED_CLAIMS: sub,name,email
      STRATEGIES_ACCESS_TOKEN: jwt
      TTL_ACCESS_TOKEN: 5m
      TTL_REFRESH_TOKEN: 720h
      OAUTH2_PKCE_ENFORCED_FOR_PUBLIC_CLIENTS: 'true'
    entrypoint: >-
      sh -c "export DSN=\"$$HYDRA_DSN\"
      URLS_SELF_ISSUER=\"$$HYDRA_URLS_SELF_ISSUER\"
      URLS_CONSENT=\"$$HYDRA_URLS_CONSENT\"
      URLS_LOGIN=\"$$HYDRA_URLS_LOGIN\"
      URLS_LOGOUT=\"$$HYDRA_URLS_LOGOUT\"
      URLS_POST_LOGOUT_REDIRECT=\"$$HYDRA_URLS_POST_LOGOUT_REDIRECT\"
      URLS_ERROR=\"$$HYDRA_URLS_ERROR\"
      SECRETS_SYSTEM=\"$$HYDRA_SECRETS_SYSTEM\"
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS=\"$${HYDRA_CORS_ALLOWED_ORIGINS:?HYDRA_CORS_ALLOWED_ORIGINS is required}\"
      SERVE_COOKIES_DOMAIN=\"$$KRATOS_COOKIES_DOMAIN\";
      exec hydra serve all"
    ports:
      - '127.0.0.1:${HYDRA_PUBLIC_HTTP_PORT:-8446}:4444'
      - '127.0.0.1:${HYDRA_ADMIN_HTTP_PORT:-4445}:4445'
    networks:
      runtime:
        aliases:
          - idnest-hydra

  kratos:
    build:
      context: /opt/idnest/identity/kratos-build
      dockerfile: Dockerfile
    image: idnest-kratos-envsubst:v26.2.0
    container_name: idnest-kratos
    user: "10000"
    restart: unless-stopped
    env_file:
      - ${IDNEST_ENV_FILE:-/etc/idnest/idnest.env}
    extra_hosts:
      - host.docker.internal:host-gateway
    entrypoint: >-
      sh -c "sh /usr/local/bin/render-kratos-config.sh
      && exec kratos serve -c /tmp/kratos.yml --watch-courier"
    ports:
      - '127.0.0.1:${KRATOS_PUBLIC_HTTP_PORT:-8447}:4433'
      - '127.0.0.1:${KRATOS_ADMIN_HTTP_PORT:-4434}:4434'
    networks:
      runtime:
        aliases:
          - idnest-kratos

networks:
  runtime:
    name: ${IDNEST_RUNTIME_NETWORK:-idnest-runtime-development}
    external: true
