# Angular admin frontend + same-origin admin-backend API.
server {
    listen 80;
    server_name admin.idnest.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.idnest.cloud;

    ssl_certificate     /etc/nginx/ssl/idnest-cloud/idnest-cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/idnest-cloud/idnest-cloudflare-origin-key.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data: https://assets.idnest.cloud; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://ory_admin_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
