component: ''
fullnameOverride: ''
revision: unknown
version: unknown
runtimeConfigRevision: unknown

replicaCount: 1

image:
  repository: ''
  digest: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []
runtimeSecretName: ''

serviceAccount:
  create: true
  name: ''
  annotations: {}

service:
  port: 80
  targetPort: 3000

migration:
  enabled: true
  serviceAccountName: default
  command:
    - node
    - migrations/authz-migrate.cjs
  activeDeadlineSeconds: 900
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600

postDeploy:
  enabled: false
  serviceAccountName: ''
  command: []
  activeDeadlineSeconds: 900
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600

probes:
  port: 3001
  path: /health/ready
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 24
  liveness:
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: '1'
    memory: 768Mi

networkPolicy:
  enabled: false
  ingressNamespace: cloudflare-tunnels
  ingressPodLabels:
    app.kubernetes.io/name: cloudflared

terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

