{{- if .Values.postDeploy.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "idnest-app.fullname" . }}-post-deploy
  labels:
    {{- include "idnest-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.postDeploy.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.postDeploy.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.postDeploy.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "idnest-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: post-deploy
    spec:
      restartPolicy: Never
      serviceAccountName: {{ default (include "idnest-app.serviceAccountName" .) .Values.postDeploy.serviceAccountName }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: post-deploy
          image: {{ include "idnest-app.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.postDeploy.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "idnest-app.fixedEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ required "runtimeSecretName is required" .Values.runtimeSecretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
{{- end }}

