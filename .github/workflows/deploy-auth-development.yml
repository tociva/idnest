name: Build and deploy auth (development)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  NX_ISOLATE_PLUGINS: 'false'

jobs:
  validate:
    name: Validate auth release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require the development branch
        env:
          DEPLOYMENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DEPLOYMENT_REF}" == refs/heads/development ]]

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.0
          run_install: false
          cache: true
          cache_dependency_path: monorepo/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: pnpm --dir=monorepo install --frozen-lockfile

      - name: Lint and typecheck auth projects
        run: |
          pnpm --dir=monorepo nx run-many -t lint typecheck --projects=auth-backend,auth-frontend,authz-store,server-runtime,shared-types

      - name: Test auth projects
        run: |
          pnpm --dir=monorepo nx run-many -t test --projects=auth-backend,auth-frontend,authz-store,server-runtime,shared-types

      - name: Validate deployment scripts
        run: |
          bash -n scripts/docker/smoke-test-auth-image.sh
          bash -n scripts/docker/ensure-builder-image.sh
          sh -n scripts/docker/builder-image-key.sh
          scripts/docker/test-builder-contract.sh
          pnpm test:cors:config
          bash scripts/ci/test-deployment-contracts.sh
          for script in scripts/deploy/vps/*.sh; do
            sh -n "${script}"
          done

  build:
    name: Build and publish auth image
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: ecr-build
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      revision: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate ECR configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_BUILD_ROLE_ARN: ${{ vars.AWS_BUILD_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.AUTH_ECR_REPOSITORY }}
          BUILDER_ECR_REPOSITORY: ${{ vars.BUILDER_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" =~ ^[a-z0-9-]+$ ]]
          [[ "${AWS_BUILD_ROLE_ARN}" == arn:aws:iam::${AWS_ACCOUNT_ID}:role/* ]]
          [[ "${ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "${BUILDER_ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]

      - name: Configure short-lived AWS build credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-auth-build-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Resolve image metadata
        id: metadata
        run: |
          set -euo pipefail
          printf 'created=%s\n' "$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_OUTPUT}"

      - name: Ensure immutable dependency builder
        id: builder
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BUILDER_ECR_REPOSITORY: ${{ vars.BUILDER_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/builder-image.env"
          scripts/docker/ensure-builder-image.sh \
            "${AWS_ACCOUNT_ID}" \
            "${AWS_REGION}" \
            "${BUILDER_ECR_REPOSITORY}" \
            "${output_file}"
          source "${output_file}"
          [[ "${BUILDER_IMAGE}" =~ @sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\n' "${BUILDER_IMAGE}" >>"${GITHUB_OUTPUT}"

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: scripts/docker/Dockerfile.auth-app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.AUTH_ECR_REPOSITORY }}:git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            BUILDER_IMAGE=${{ steps.builder.outputs.image }}
            APP_VERSION=${{ github.sha }}
            APP_REVISION=${{ github.sha }}
            APP_CREATED=${{ steps.metadata.outputs.created }}
            APP_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=idnest-auth-app
          cache-to: type=gha,mode=max,scope=idnest-auth-app
          provenance: mode=max
          sbom: true

      - name: Smoke-test pushed digest
        env:
          IMAGE_REF: ${{ steps.ecr.outputs.registry }}/${{ vars.AUTH_ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_REF}" =~ @sha256:[a-f0-9]{64}$ ]]
          docker pull "${IMAGE_REF}"
          scripts/docker/smoke-test-auth-image.sh "${IMAGE_REF}"

  deploy:
    name: Deploy auth to development
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: development-auth
    concurrency:
      group: idnest-vps-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ needs.build.outputs.revision }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ vars.ADMIN_BOOTSTRAP_EMAILS }}
          DELEGATION_ENABLED: ${{ vars.DELEGATION_ENABLED }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          CONSENT_ACTION_SECRET: ${{ secrets.CONSENT_ACTION_SECRET }}
          AUTH_TRANSACTION_SECRET: ${{ secrets.AUTH_TRANSACTION_SECRET }}
          AUTH_AUDIT_HASH_SECRET: ${{ secrets.AUTH_AUDIT_HASH_SECRET }}
          DELEGATION_SIGNING_PRIVATE_KEY_B64: ${{ secrets.DELEGATION_SIGNING_PRIVATE_KEY_B64 }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          scripts/deploy/ci/validate-release-inputs.sh app auth

      - name: Configure short-lived AWS pull credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-auth-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Prepare SSH and release
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ vars.ADMIN_BOOTSTRAP_EMAILS }}
          DELEGATION_ENABLED: ${{ vars.DELEGATION_ENABLED }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          CONSENT_ACTION_SECRET: ${{ secrets.CONSENT_ACTION_SECRET }}
          AUTH_TRANSACTION_SECRET: ${{ secrets.AUTH_TRANSACTION_SECRET }}
          AUTH_AUDIT_HASH_SECRET: ${{ secrets.AUTH_AUDIT_HASH_SECRET }}
          DELEGATION_SIGNING_PRIVATE_KEY_B64: ${{ secrets.DELEGATION_SIGNING_PRIVATE_KEY_B64 }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          scripts/deploy/ci/prepare-release-request.sh app auth

      - name: Upload release request inputs
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          scripts/deploy/ci/upload-release-request.sh

      - name: Submit release and wait for root processor
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ needs.build.outputs.revision }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          scripts/deploy/ci/submit-release-request.sh app auth

      - name: Remove runner-side sensitive files
        if: ${{ always() }}
        run: |
          scripts/deploy/ci/cleanup-release-request.sh
