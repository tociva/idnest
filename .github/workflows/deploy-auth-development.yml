name: Build and deploy auth (development)

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/deploy-auth-development.yml'
      - 'monorepo/apps/auth-backend/**'
      - 'monorepo/apps/auth-frontend/**'
      - 'monorepo/libs/authz-store/**'
      - 'monorepo/libs/server-runtime/**'
      - 'monorepo/libs/shared-types/**'
      - 'config/**'
      - '.env.example'
      - 'scripts/authz/**'
      - 'scripts/docker/Dockerfile.auth-app'
      - 'scripts/docker/smoke-test-auth-image.sh'
      - 'scripts/docker/render-kratos-config.sh'
      - 'scripts/deploy/env/auth-app.env.example'
      - 'scripts/deploy/vps/**'
      - 'package.json'
      - 'monorepo/package.json'
      - 'monorepo/pnpm-lock.yaml'
      - 'monorepo/pnpm-workspace.yaml'
      - 'monorepo/nx.json'
      - 'monorepo/tsconfig.base.json'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  NX_ISOLATE_PLUGINS: 'false'

jobs:
  validate:
    name: Validate auth release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require the development branch
        env:
          DEPLOYMENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DEPLOYMENT_REF}" == refs/heads/development ]]

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          version: 9.15.0
          runtime: node@22.22.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm --dir=monorepo install --frozen-lockfile

      - name: Lint and typecheck auth projects
        run: |
          pnpm --dir=monorepo nx run-many -t lint typecheck --projects=auth-backend,auth-frontend,authz-store,server-runtime,shared-types

      - name: Test auth projects
        run: |
          pnpm --dir=monorepo nx run-many -t test --projects=auth-backend,authz-store,server-runtime,shared-types

      - name: Build release outputs
        run: |
          pnpm --dir=monorepo auth-backend:build
          pnpm --dir=monorepo auth-frontend:build
          pnpm --dir=monorepo authz:migrate:build

      - name: Validate deployment scripts
        run: |
          bash -n scripts/docker/smoke-test-auth-image.sh
          for script in scripts/deploy/vps/*.sh; do
            sh -n "${script}"
          done

  build:
    name: Build and publish auth image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ecr-build
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      revision: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate ECR configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_BUILD_ROLE_ARN: ${{ vars.AWS_BUILD_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.AUTH_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" =~ ^[a-z0-9-]+$ ]]
          [[ "${AWS_BUILD_ROLE_ARN}" == arn:aws:iam::${AWS_ACCOUNT_ID}:role/* ]]
          [[ "${ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]

      - name: Configure short-lived AWS build credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-auth-build-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Resolve image metadata
        id: metadata
        run: |
          set -euo pipefail
          printf 'created=%s\n' "$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_OUTPUT}"

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: scripts/docker/Dockerfile.auth-app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.AUTH_ECR_REPOSITORY }}:git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_REVISION=${{ github.sha }}
            APP_CREATED=${{ steps.metadata.outputs.created }}
            APP_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=idnest-auth-app
          cache-to: type=gha,mode=max,scope=idnest-auth-app
          provenance: mode=max
          sbom: true

      - name: Smoke-test pushed digest
        env:
          IMAGE_REF: ${{ steps.ecr.outputs.registry }}/${{ vars.AUTH_ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_REF}" =~ @sha256:[a-f0-9]{64}$ ]]
          docker pull "${IMAGE_REF}"
          scripts/docker/smoke-test-auth-image.sh "${IMAGE_REF}"

  deploy:
    name: Deploy auth to development
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: development-auth
    concurrency:
      group: idnest-vps-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ needs.build.outputs.revision }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${REVISION}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" =~ ^[a-z0-9-]+$ ]]
          [[ "${AWS_DEPLOY_ROLE_ARN}" == arn:aws:iam::${AWS_ACCOUNT_ID}:role/* ]]
          [[ "${ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "${VPS_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${VPS_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          [[ "${VPS_USER}" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]
          [[ -n "${HOST_RELEASE_SIGNING_PRIVATE_KEY_B64}" ]]
          [[ -n "${VPS_SSH_PRIVATE_KEY_B64}" && -n "${VPS_SSH_KNOWN_HOSTS_B64}" ]]

      - name: Configure short-lived AWS pull credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-auth-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Prepare SSH and release
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/ory-ssh"
          printf '%s' "${VPS_SSH_PRIVATE_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/ory-ssh/id_ed25519"
          printf '%s' "${VPS_SSH_KNOWN_HOSTS_B64}" | base64 --decode > "${RUNNER_TEMP}/ory-ssh/known_hosts"
          printf '%s' "${HOST_RELEASE_SIGNING_PRIVATE_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/host-release-signing-private.pem"
          git ls-files -z -- config/kratos.tpl.yml config/kratos |
            tar --null --files-from=- --create --gzip --file "${RUNNER_TEMP}/ory-config.tar.gz"
          tar --create --gzip --file "${RUNNER_TEMP}/host-release.tar.gz" \
            scripts/deploy/vps/compose.auth.yaml \
            scripts/deploy/vps/compose.admin.yaml \
            scripts/deploy/vps/compose.ory.yaml \
            scripts/deploy/vps/Dockerfile.kratos \
            scripts/deploy/vps/deploy-ory-app.sh \
            scripts/deploy/vps/deploy-ory-infra.sh \
            scripts/deploy/vps/deploy-ory-auth.sh \
            scripts/deploy/vps/deploy-ory-admin.sh \
            scripts/deploy/vps/rollback-ory-app.sh \
            scripts/deploy/vps/rollback-ory-auth.sh \
            scripts/deploy/vps/rollback-ory-admin.sh \
            scripts/deploy/vps/validate-app-env.sh \
            scripts/docker/render-kratos-config.sh
          openssl pkey -in "${RUNNER_TEMP}/host-release-signing-private.pem" -noout
          openssl dgst -sha256 -sign "${RUNNER_TEMP}/host-release-signing-private.pem" \
            -out "${RUNNER_TEMP}/host-release.sig" "${RUNNER_TEMP}/host-release.tar.gz"
          aws ecr get-login-password --region "${AWS_REGION}" > "${RUNNER_TEMP}/ecr-password"
          chmod 600 "${RUNNER_TEMP}/ory-ssh/id_ed25519" "${RUNNER_TEMP}/ory-ssh/known_hosts" \
            "${RUNNER_TEMP}/ory-config.tar.gz" \
            "${RUNNER_TEMP}/host-release.tar.gz" "${RUNNER_TEMP}/host-release.sig" \
            "${RUNNER_TEMP}/host-release-signing-private.pem" "${RUNNER_TEMP}/ecr-password"

      - name: Upload release request inputs
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          scp_args=(
            -i "${RUNNER_TEMP}/ory-ssh/id_ed25519"
            -P "${port}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${RUNNER_TEMP}/ory-ssh/known_hosts"
          )
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for name in ory-config.tar.gz host-release.tar.gz host-release.sig ecr-password; do
            scp "${scp_args[@]}" "${RUNNER_TEMP}/${name}" \
              "${VPS_USER}@${VPS_HOST}:/var/lib/ory-auth/queue/incoming/${name}.${request_id}.upload"
          done

      - name: Submit release and wait for root processor
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ needs.build.outputs.revision }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_ref="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          host_bundle_sha256=$(sha256sum "${RUNNER_TEMP}/host-release.tar.gz" | awk '{print $1}')
          ssh_args=(
            -i "${RUNNER_TEMP}/ory-ssh/id_ed25519"
            -p "${port}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${RUNNER_TEMP}/ory-ssh/known_hosts"
          )
          ssh "${ssh_args[@]}" "${VPS_USER}@${VPS_HOST}" \
            /usr/local/bin/submit-ory-release auth "${request_id}" "${GITHUB_RUN_ID}" \
            "${REVISION}" "${image_ref}" "${host_bundle_sha256}"
          ssh "${ssh_args[@]}" "${VPS_USER}@${VPS_HOST}" \
            /usr/local/bin/wait-ory-release auth "${request_id}" 2200

      - name: Remove runner-side sensitive files
        if: ${{ always() }}
        run: |
          rm -f "${RUNNER_TEMP}/ory-config.tar.gz"
          rm -f "${RUNNER_TEMP}/host-release.tar.gz" "${RUNNER_TEMP}/host-release.sig"
          rm -f "${RUNNER_TEMP}/host-release-signing-private.pem" "${RUNNER_TEMP}/ecr-password"
          rm -f "${RUNNER_TEMP}/ory-ssh/id_ed25519" "${RUNNER_TEMP}/ory-ssh/known_hosts"
