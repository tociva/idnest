name: Build and publish application image

on:
  workflow_dispatch:
    inputs:
      component:
        description: Idnest application to build
        required: true
        type: choice
        options: [auth, admin, all]
      release:
        description: Semantic version increment from package.json
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: idnest-image-release
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  NX_ISOLATE_PLUGINS: 'false'

jobs:
  quality:
    name: Validate ${{ inputs.component }} ${{ inputs.release }} release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      components: ${{ steps.request.outputs.components }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      - name: Validate release request
        id: request
        env:
          COMPONENT: ${{ inputs.component }}
          RELEASE_TYPE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == branch ]]
          [[ "${COMPONENT}" == auth || "${COMPONENT}" == admin || "${COMPONENT}" == all ]]
          [[ "${RELEASE_TYPE}" == major || "${RELEASE_TYPE}" == minor || "${RELEASE_TYPE}" == patch ]]
          version=$(node deploy/ci/release-version.mjs "${RELEASE_TYPE}")
          case "${COMPONENT}" in
            auth) printf '%s\n' 'components=["auth"]' >>"${GITHUB_OUTPUT}" ;;
            admin) printf '%s\n' 'components=["admin"]' >>"${GITHUB_OUTPUT}" ;;
            all) printf '%s\n' 'components=["auth","admin"]' >>"${GITHUB_OUTPUT}" ;;
          esac
          printf 'version=%s\n' "${version}" >>"${GITHUB_OUTPUT}"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.0
          run_install: false
          cache: true
          cache_dependency_path: monorepo/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir=monorepo install --frozen-lockfile

      - name: Lint, typecheck and test selected components
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          case "${COMPONENT}" in
            auth)
              projects=auth-backend,auth-frontend,authz-store,server-runtime,shared-types
              ;;
            admin)
              projects=admin-backend,admin-frontend,authz-store,server-runtime,shared-types
              ;;
            all)
              projects=auth-backend,auth-frontend,admin-backend,admin-frontend,authz-store,server-runtime,shared-types
              ;;
          esac
          pnpm --dir=monorepo nx run-many -t lint typecheck --projects="${projects}"
          pnpm --dir=monorepo nx run-many -t test --projects="${projects}"
          if [[ "${COMPONENT}" == auth || "${COMPONENT}" == all ]]; then
            pnpm test:cors:config
          fi
          if [[ "${COMPONENT}" == admin || "${COMPONENT}" == all ]]; then
            pnpm test:cors
          fi
          pnpm test:deploy

  build:
    name: Build ${{ matrix.component }} ${{ needs.quality.outputs.version }}
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.quality.outputs.components) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: ecr-build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve component metadata
        id: metadata
        env:
          COMPONENT: ${{ matrix.component }}
          AUTH_ECR_REPOSITORY: ${{ vars.AUTH_ECR_REPOSITORY }}
          ADMIN_ECR_REPOSITORY: ${{ vars.ADMIN_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          case "${COMPONENT}" in
            auth)
              repository=${AUTH_ECR_REPOSITORY}
              dockerfile=deploy/images/Dockerfile.auth-app
              smoke_test=deploy/images/smoke-test-auth-image.sh
              ;;
            admin)
              repository=${ADMIN_ECR_REPOSITORY}
              dockerfile=deploy/images/Dockerfile.admin-app
              smoke_test=deploy/images/smoke-test-admin-image.sh
              ;;
          esac
          [[ "${repository}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
          {
            echo "repository=${repository}"
            echo "dockerfile=${dockerfile}"
            echo "smoke_test=${smoke_test}"
            echo "candidate_tag=git-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "created=$(git show -s --format=%cI "${GITHUB_SHA}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Validate ECR Public configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_PUBLIC_REGION: ${{ vars.ECR_PUBLIC_REGION }}
          ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
          AWS_BUILD_ROLE_ARN: ${{ vars.AWS_BUILD_ROLE_ARN }}
          BUILDER_ECR_REPOSITORY: ${{ vars.BUILDER_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${ECR_PUBLIC_REGION}" == us-east-1 ]]
          [[ "${ECR_PUBLIC_REGISTRY}" =~ ^public\.ecr\.aws/[a-z0-9][a-z0-9._-]*$ ]]
          [[ "${AWS_BUILD_ROLE_ARN}" == arn:aws:iam::${AWS_ACCOUNT_ID}:role/* ]]
          [[ "${BUILDER_ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]

      - name: Configure short-lived AWS build credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.ECR_PUBLIC_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-${{ matrix.component }}-build-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Ensure immutable dependency builder
        id: builder
        env:
          ECR_PUBLIC_REGION: ${{ vars.ECR_PUBLIC_REGION }}
          ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
          BUILDER_ECR_REPOSITORY: ${{ vars.BUILDER_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/builder-image.env"
          deploy/images/ensure-builder-image.sh \
            "${ECR_PUBLIC_REGISTRY}" "${ECR_PUBLIC_REGION}" \
            "${BUILDER_ECR_REPOSITORY}" "${output_file}"
          source "${output_file}"
          [[ "${BUILDER_IMAGE}" =~ @sha256:[a-f0-9]{64}$ ]]
          echo "image=${BUILDER_IMAGE}" >>"${GITHUB_OUTPUT}"

      - name: Build and push candidate image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ steps.metadata.outputs.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_PUBLIC_REGISTRY }}/${{ steps.metadata.outputs.repository }}:${{ steps.metadata.outputs.candidate_tag }}
          build-args: |
            BUILDER_IMAGE=${{ steps.builder.outputs.image }}
            APP_VERSION=${{ needs.quality.outputs.version }}
            APP_REVISION=${{ github.sha }}
            APP_CREATED=${{ steps.metadata.outputs.created }}
            APP_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=idnest-${{ matrix.component }}-app
          cache-to: type=gha,mode=max,scope=idnest-${{ matrix.component }}-app
          provenance: mode=max
          sbom: true

      - name: Enforce vulnerability threshold
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.ECR_PUBLIC_REGISTRY }}/${{ steps.metadata.outputs.repository }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Smoke-test pushed digest
        env:
          IMAGE_REF: ${{ vars.ECR_PUBLIC_REGISTRY }}/${{ steps.metadata.outputs.repository }}@${{ steps.image.outputs.digest }}
          SMOKE_TEST: ${{ steps.metadata.outputs.smoke_test }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_REF}" =~ @sha256:[a-f0-9]{64}$ ]]
          docker pull --platform linux/arm64 "${IMAGE_REF}"
          "${SMOKE_TEST}" "${IMAGE_REF}"

      - name: Remove failed candidate tag
        if: ${{ failure() && steps.metadata.outputs.candidate_tag != '' }}
        continue-on-error: true
        env:
          ECR_PUBLIC_REGION: ${{ vars.ECR_PUBLIC_REGION }}
          ECR_REPOSITORY: ${{ steps.metadata.outputs.repository }}
          CANDIDATE_TAG: ${{ steps.metadata.outputs.candidate_tag }}
        run: |
          aws ecr-public batch-delete-image --region "${ECR_PUBLIC_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${CANDIDATE_TAG}" >/dev/null

  publish:
    name: Publish ${{ inputs.component }} ${{ needs.quality.outputs.version }}
    needs: [quality, build]
    if: ${{ always() && needs.quality.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ecr-build
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Configure short-lived AWS build credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.ECR_PUBLIC_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-publish-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Publish release tags or clean up failed candidates
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          COMPONENT: ${{ inputs.component }}
          RELEASE_TYPE: ${{ inputs.release }}
          VERSION: ${{ needs.quality.outputs.version }}
          ECR_PUBLIC_REGION: ${{ vars.ECR_PUBLIC_REGION }}
          ECR_PUBLIC_REGISTRY: ${{ vars.ECR_PUBLIC_REGISTRY }}
          AUTH_ECR_REPOSITORY: ${{ vars.AUTH_ECR_REPOSITORY }}
          ADMIN_ECR_REPOSITORY: ${{ vars.ADMIN_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          candidate_tag=git-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          if [[ "${COMPONENT}" == all ]]; then
            components=(auth admin)
          else
            components=("${COMPONENT}")
          fi

          repository_for() {
            if [[ "$1" == auth ]]; then
              printf '%s\n' "${AUTH_ECR_REPOSITORY}"
            else
              printf '%s\n' "${ADMIN_ECR_REPOSITORY}"
            fi
          }

          cleanup_candidates() {
            for item in "${components[@]}"; do
              repository=$(repository_for "${item}")
              aws ecr-public batch-delete-image --region "${ECR_PUBLIC_REGION}" \
                --repository-name "${repository}" \
                --image-ids "imageTag=${candidate_tag}" >/dev/null 2>&1 || true
            done
          }
          trap cleanup_candidates EXIT

          [[ "${BUILD_RESULT}" == success ]] || {
            echo "At least one component failed validation; no release tag was published." >&2
            exit 1
          }

          # Check every final tag before publishing any of them. This preserves
          # the all-components release contract for normal and retry paths.
          for item in "${components[@]}"; do
            repository=$(repository_for "${item}")
            release_tag=${item}-v${VERSION}
            existing=$(aws ecr-public describe-images --region "${ECR_PUBLIC_REGION}" \
              --repository-name "${repository}" --image-ids "imageTag=${release_tag}" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
            [[ -z "${existing}" || "${existing}" == None ]] || {
              echo "Release tag already exists: ${repository}:${release_tag}" >&2
              exit 1
            }
          done

          # Persist the version only after every selected candidate passes. A
          # concurrent update to the selected branch invalidates this release.
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || {
            echo "The selected branch advanced during validation; rerun the release." >&2
            exit 1
          }
          computed_version=$(node deploy/ci/release-version.mjs "${RELEASE_TYPE}")
          [[ "${computed_version}" == "${VERSION}" ]]
          written_version=$(node deploy/ci/release-version.mjs "${RELEASE_TYPE}" --write)
          [[ "${written_version}" == "${VERSION}" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git diff --cached --quiet && {
            echo "package.json version did not change." >&2
            exit 1
          }
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          for item in "${components[@]}"; do
            repository=$(repository_for "${item}")
            release_tag=${item}-v${VERSION}
            candidate_digest=$(aws ecr-public describe-images --region "${ECR_PUBLIC_REGION}" \
              --repository-name "${repository}" --image-ids "imageTag=${candidate_tag}" \
              --query 'imageDetails[0].imageDigest' --output text)
            [[ "${candidate_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
            deploy/ci/promote-ecr-public-image.sh \
              "${ECR_PUBLIC_REGISTRY}" "${repository}" \
              "${candidate_digest}" "${release_tag}"
            {
              echo "### Idnest ${item} image"
              echo "- Version: \`${VERSION}\`"
              echo "- Image: \`${ECR_PUBLIC_REGISTRY}/${repository}:${release_tag}\`"
              echo "- Digest: \`${candidate_digest}\`"
              echo "- Platform: \`linux/arm64\`"
            } >>"${GITHUB_STEP_SUMMARY}"
          done
