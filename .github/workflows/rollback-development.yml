# Redeploys an existing development auth or admin image. Does not rebuild, and
# does not reverse database migrations applied by a newer image.
name: Rollback app (development)

on:
  workflow_dispatch:
    inputs:
      component:
        description: Application to roll back
        required: true
        type: choice
        options: [auth, admin]
      version:
        description: Existing ECR image tag (git-<sha>-<run_id>-<attempt>) or digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback ${{ inputs.component }} to development
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: development-${{ inputs.component }}
    concurrency:
      group: idnest-vps-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the development branch
        env:
          DEPLOYMENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DEPLOYMENT_REF}" == refs/heads/development ]]

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate rollback configuration
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ vars.ADMIN_BOOTSTRAP_EMAILS }}
          DELEGATION_ENABLED: ${{ vars.DELEGATION_ENABLED }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          CONSENT_ACTION_SECRET: ${{ secrets.CONSENT_ACTION_SECRET }}
          AUTH_TRANSACTION_SECRET: ${{ secrets.AUTH_TRANSACTION_SECRET }}
          AUTH_AUDIT_HASH_SECRET: ${{ secrets.AUTH_AUDIT_HASH_SECRET }}
          DELEGATION_SIGNING_PRIVATE_KEY_B64: ${{ secrets.DELEGATION_SIGNING_PRIVATE_KEY_B64 }}
          ADMIN_CSRF_SECRET: ${{ secrets.ADMIN_CSRF_SECRET }}
          ADMIN_OIDC_CLIENT_SECRET: ${{ secrets.ADMIN_OIDC_CLIENT_SECRET }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          scripts/deploy/ci/validate-release-inputs.sh rollback

      - name: Configure short-lived AWS pull credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-${{ inputs.component }}-rollback-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Resolve existing image
        id: image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/rollback-image.env"
          scripts/deploy/resolve-development-rollback-image.sh \
            "${AWS_ACCOUNT_ID}" \
            "${AWS_REGION}" \
            "${ECR_REPOSITORY}" \
            "${VERSION}" \
            "${output_file}"
          source "${output_file}"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${REVISION}" =~ ^[a-f0-9]{40}$ ]]
          printf 'digest=%s\n' "${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"
          printf 'revision=%s\n' "${REVISION}" >>"${GITHUB_OUTPUT}"

      - name: Prepare SSH and release
        env:
          COMPONENT: ${{ inputs.component }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ vars.ADMIN_BOOTSTRAP_EMAILS }}
          DELEGATION_ENABLED: ${{ vars.DELEGATION_ENABLED }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          CONSENT_ACTION_SECRET: ${{ secrets.CONSENT_ACTION_SECRET }}
          AUTH_TRANSACTION_SECRET: ${{ secrets.AUTH_TRANSACTION_SECRET }}
          AUTH_AUDIT_HASH_SECRET: ${{ secrets.AUTH_AUDIT_HASH_SECRET }}
          DELEGATION_SIGNING_PRIVATE_KEY_B64: ${{ secrets.DELEGATION_SIGNING_PRIVATE_KEY_B64 }}
          ADMIN_CSRF_SECRET: ${{ secrets.ADMIN_CSRF_SECRET }}
          ADMIN_OIDC_CLIENT_SECRET: ${{ secrets.ADMIN_OIDC_CLIENT_SECRET }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          scripts/deploy/ci/prepare-release-request.sh app "${COMPONENT}"

      - name: Upload release request inputs
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          scripts/deploy/ci/upload-release-request.sh

      - name: Submit release and wait for root processor
        env:
          COMPONENT: ${{ inputs.component }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.image.outputs.revision }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          scripts/deploy/ci/submit-release-request.sh app "${COMPONENT}"

      - name: Remove runner-side sensitive files
        if: ${{ always() }}
        run: |
          scripts/deploy/ci/cleanup-release-request.sh
