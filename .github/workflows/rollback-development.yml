# Redeploys an existing development auth or admin image. Does not rebuild, and
# does not reverse database migrations applied by a newer image.
name: Rollback app (development)

on:
  workflow_dispatch:
    inputs:
      component:
        description: Application to roll back
        required: true
        type: choice
        options: [auth, admin]
      version:
        description: Existing ECR image tag (git-<sha>-<run_id>-<attempt>) or digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback ${{ inputs.component }} to development
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: development-${{ inputs.component }}
    concurrency:
      group: idnest-vps-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the development branch
        env:
          DEPLOYMENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DEPLOYMENT_REF}" == refs/heads/development ]]

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate rollback configuration
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ vars.ADMIN_BOOTSTRAP_EMAILS }}
          DELEGATION_ENABLED: ${{ vars.DELEGATION_ENABLED }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          CONSENT_ACTION_SECRET: ${{ secrets.CONSENT_ACTION_SECRET }}
          AUTH_TRANSACTION_SECRET: ${{ secrets.AUTH_TRANSACTION_SECRET }}
          AUTH_AUDIT_HASH_SECRET: ${{ secrets.AUTH_AUDIT_HASH_SECRET }}
          DELEGATION_SIGNING_PRIVATE_KEY_B64: ${{ secrets.DELEGATION_SIGNING_PRIVATE_KEY_B64 }}
          ADMIN_CSRF_SECRET: ${{ secrets.ADMIN_CSRF_SECRET }}
          ADMIN_OIDC_CLIENT_SECRET: ${{ secrets.ADMIN_OIDC_CLIENT_SECRET }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          set -euo pipefail
          [[ "${COMPONENT}" == auth || "${COMPONENT}" == admin ]]
          [[ "${VERSION}" =~ ^sha256:[a-f0-9]{64}$ || "${VERSION}" =~ ^git-[a-f0-9]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" =~ ^[a-z0-9-]+$ ]]
          [[ "${AWS_DEPLOY_ROLE_ARN}" == arn:aws:iam::${AWS_ACCOUNT_ID}:role/* ]]
          [[ "${ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "${VPS_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${VPS_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          [[ "${VPS_USER}" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]
          [[ -n "${ADMIN_BOOTSTRAP_EMAILS}" ]]
          [[ -n "${HOST_RELEASE_SIGNING_PRIVATE_KEY_B64}" ]]
          [[ -n "${AUTHZ_DATABASE_URL}" ]]
          if [[ "${COMPONENT}" == auth ]]; then
            [[ "${DELEGATION_ENABLED}" == true || "${DELEGATION_ENABLED}" == false ]]
            [[ -n "${CONSENT_ACTION_SECRET}" ]]
            [[ -n "${AUTH_TRANSACTION_SECRET}" ]]
            [[ -n "${AUTH_AUDIT_HASH_SECRET}" ]]
            [[ -n "${DELEGATION_SIGNING_PRIVATE_KEY_B64}" ]]
          else
            [[ -n "${ADMIN_CSRF_SECRET}" ]]
            [[ -n "${ADMIN_OIDC_CLIENT_SECRET}" ]]
          fi
          [[ -n "${VPS_SSH_PRIVATE_KEY_B64}" && -n "${VPS_SSH_KNOWN_HOSTS_B64}" ]]
          bash -n scripts/deploy/resolve-development-rollback-image.sh
          bash -n scripts/deploy/render-development-app-env.sh
          bash scripts/ci/test-deployment-contracts.sh
          for script in scripts/deploy/vps/*.sh; do
            sh -n "${script}"
          done

      - name: Configure short-lived AWS pull credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-${{ inputs.component }}-rollback-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Resolve existing image
        id: image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/rollback-image.env"
          scripts/deploy/resolve-development-rollback-image.sh \
            "${AWS_ACCOUNT_ID}" \
            "${AWS_REGION}" \
            "${ECR_REPOSITORY}" \
            "${VERSION}" \
            "${output_file}"
          source "${output_file}"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${REVISION}" =~ ^[a-f0-9]{40}$ ]]
          printf 'digest=%s\n' "${IMAGE_DIGEST}" >>"${GITHUB_OUTPUT}"
          printf 'revision=%s\n' "${REVISION}" >>"${GITHUB_OUTPUT}"

      - name: Prepare SSH and release
        env:
          COMPONENT: ${{ inputs.component }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ vars.ADMIN_BOOTSTRAP_EMAILS }}
          DELEGATION_ENABLED: ${{ vars.DELEGATION_ENABLED }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          CONSENT_ACTION_SECRET: ${{ secrets.CONSENT_ACTION_SECRET }}
          AUTH_TRANSACTION_SECRET: ${{ secrets.AUTH_TRANSACTION_SECRET }}
          AUTH_AUDIT_HASH_SECRET: ${{ secrets.AUTH_AUDIT_HASH_SECRET }}
          DELEGATION_SIGNING_PRIVATE_KEY_B64: ${{ secrets.DELEGATION_SIGNING_PRIVATE_KEY_B64 }}
          ADMIN_CSRF_SECRET: ${{ secrets.ADMIN_CSRF_SECRET }}
          ADMIN_OIDC_CLIENT_SECRET: ${{ secrets.ADMIN_OIDC_CLIENT_SECRET }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/idnest-ssh"
          printf '%s' "${VPS_SSH_PRIVATE_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/idnest-ssh/id_ed25519"
          printf '%s' "${VPS_SSH_KNOWN_HOSTS_B64}" | base64 --decode > "${RUNNER_TEMP}/idnest-ssh/known_hosts"
          printf '%s' "${HOST_RELEASE_SIGNING_PRIVATE_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/host-release-signing-private.pem"
          scripts/deploy/render-development-app-env.sh "${COMPONENT}" "${RUNNER_TEMP}/app.env"
          tar --create --gzip --file "${RUNNER_TEMP}/host-release.tar.gz" \
            scripts/deploy/vps/compose.auth.yaml \
            scripts/deploy/vps/compose.admin.yaml \
            scripts/deploy/vps/compose.idnest.yaml \
            scripts/deploy/vps/Dockerfile.kratos \
            scripts/deploy/vps/deploy-idnest-app.sh \
            scripts/deploy/vps/deploy-idnest-infra.sh \
            scripts/deploy/vps/deploy-idnest-auth.sh \
            scripts/deploy/vps/deploy-idnest-admin.sh \
            scripts/deploy/vps/rollback-idnest-app.sh \
            scripts/deploy/vps/rollback-idnest-auth.sh \
            scripts/deploy/vps/rollback-idnest-admin.sh \
            scripts/deploy/vps/validate-app-env.sh \
            scripts/deploy/vps/idnest-cloudflared.service \
            scripts/docker/render-kratos-config.sh
          openssl pkey -in "${RUNNER_TEMP}/host-release-signing-private.pem" -noout
          openssl pkeyutl -sign -rawin \
            -inkey "${RUNNER_TEMP}/host-release-signing-private.pem" \
            -in "${RUNNER_TEMP}/host-release.tar.gz" -out "${RUNNER_TEMP}/host-release.sig"
          openssl pkeyutl -sign -rawin \
            -inkey "${RUNNER_TEMP}/host-release-signing-private.pem" \
            -in "${RUNNER_TEMP}/app.env" -out "${RUNNER_TEMP}/app-env.sig"
          aws ecr get-login-password --region "${AWS_REGION}" > "${RUNNER_TEMP}/ecr-password"
          chmod 600 "${RUNNER_TEMP}/idnest-ssh/id_ed25519" "${RUNNER_TEMP}/idnest-ssh/known_hosts" \
            "${RUNNER_TEMP}/app.env" "${RUNNER_TEMP}/app-env.sig" \
            "${RUNNER_TEMP}/host-release.tar.gz" "${RUNNER_TEMP}/host-release.sig" \
            "${RUNNER_TEMP}/host-release-signing-private.pem" "${RUNNER_TEMP}/ecr-password"

      - name: Upload release request inputs
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          scp_args=(
            -i "${RUNNER_TEMP}/idnest-ssh/id_ed25519"
            -P "${port}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${RUNNER_TEMP}/idnest-ssh/known_hosts"
          )
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for name in host-release.tar.gz host-release.sig app.env app-env.sig ecr-password; do
            scp "${scp_args[@]}" "${RUNNER_TEMP}/${name}" \
              "${VPS_USER}@${VPS_HOST}:/var/lib/idnest/queue/incoming/${name}.${request_id}.upload"
          done

      - name: Submit release and wait for root processor
        env:
          COMPONENT: ${{ inputs.component }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.image.outputs.revision }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_ref="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          host_bundle_sha256=$(sha256sum "${RUNNER_TEMP}/host-release.tar.gz" | awk '{print $1}')
          app_env_sha256=$(sha256sum "${RUNNER_TEMP}/app.env" | awk '{print $1}')
          ssh_args=(
            -i "${RUNNER_TEMP}/idnest-ssh/id_ed25519"
            -p "${port}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${RUNNER_TEMP}/idnest-ssh/known_hosts"
          )
          ssh "${ssh_args[@]}" "${VPS_USER}@${VPS_HOST}" \
            /usr/local/bin/submit-idnest-release "${COMPONENT}" "${request_id}" "${GITHUB_RUN_ID}" \
            "${REVISION}" "${image_ref}" "${host_bundle_sha256}" "${app_env_sha256}"
          ssh "${ssh_args[@]}" "${VPS_USER}@${VPS_HOST}" \
            /usr/local/bin/wait-idnest-release "${COMPONENT}" "${request_id}" 2200

      - name: Remove runner-side sensitive files
        if: ${{ always() }}
        run: |
          rm -f "${RUNNER_TEMP}/rollback-image.env"
          rm -f "${RUNNER_TEMP}/app.env" "${RUNNER_TEMP}/app-env.sig"
          rm -f "${RUNNER_TEMP}/host-release.tar.gz" "${RUNNER_TEMP}/host-release.sig"
          rm -f "${RUNNER_TEMP}/host-release-signing-private.pem" "${RUNNER_TEMP}/ecr-password"
          rm -f "${RUNNER_TEMP}/idnest-ssh/id_ed25519" "${RUNNER_TEMP}/idnest-ssh/known_hosts"
