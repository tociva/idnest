name: Promote Idnest application to production

on:
  workflow_dispatch:
    inputs:
      component:
        description: Application component to promote
        required: true
        type: choice
        options: [auth, admin]
      image_digest:
        description: Previously tested ECR image digest (sha256:...)
        required: true
        type: string
      revision:
        description: Full Git revision used to build the image
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Promote ${{ inputs.component }} to production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production-${{ inputs.component }}
    concurrency:
      group: idnest-vps-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the promoted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Validate promotion inputs
        env:
          COMPONENT: ${{ inputs.component }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          REVISION: ${{ inputs.revision }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          scripts/deploy/ci/validate-release-inputs.sh promotion

      - name: Confirm checked-out revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${REVISION}" ]]

      - name: Configure short-lived AWS pull credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-production-${{ inputs.component }}-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Prepare signed release request
        env:
          COMPONENT: ${{ inputs.component }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          scripts/deploy/ci/prepare-release-request.sh promotion "${COMPONENT}"

      - name: Upload release request inputs
        env:
          COMPONENT: ${{ inputs.component }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          scripts/deploy/ci/upload-release-request.sh

      - name: Submit release and wait for root processor
        env:
          COMPONENT: ${{ inputs.component }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          REVISION: ${{ inputs.revision }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          scripts/deploy/ci/submit-release-request.sh promotion "${COMPONENT}"

      - name: Remove runner-side sensitive files
        if: ${{ always() }}
        run: |
          scripts/deploy/ci/cleanup-release-request.sh
