name: Build and deploy admin (development)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  NX_ISOLATE_PLUGINS: 'false'

jobs:
  validate:
    name: Validate admin release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require the development branch
        env:
          DEPLOYMENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${DEPLOYMENT_REF}" == refs/heads/development ]]

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.0
          run_install: false
          cache: true
          cache_dependency_path: monorepo/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: pnpm --dir=monorepo install --frozen-lockfile

      - name: Lint and typecheck admin projects
        run: |
          pnpm --dir=monorepo nx run-many -t lint typecheck --projects=admin-backend,admin-frontend,authz-store,server-runtime,shared-types

      - name: Test admin projects
        run: |
          pnpm --dir=monorepo nx run-many -t test --projects=admin-backend,authz-store,server-runtime,shared-types

      - name: Validate and test CORS configuration
        run: pnpm test:cors

      - name: Validate deployment scripts
        run: |
          bash -n scripts/docker/smoke-test-admin-image.sh
          bash -n scripts/docker/ensure-builder-image.sh
          sh -n scripts/docker/builder-image-key.sh
          scripts/docker/test-builder-contract.sh
          bash scripts/ci/test-deployment-contracts.sh
          for script in scripts/deploy/vps/*.sh; do
            sh -n "${script}"
          done

  build:
    name: Build and publish admin image
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: ecr-build
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      revision: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate ECR configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_BUILD_ROLE_ARN: ${{ vars.AWS_BUILD_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ADMIN_ECR_REPOSITORY }}
          BUILDER_ECR_REPOSITORY: ${{ vars.BUILDER_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" =~ ^[a-z0-9-]+$ ]]
          [[ "${AWS_BUILD_ROLE_ARN}" == arn:aws:iam::${AWS_ACCOUNT_ID}:role/* ]]
          [[ "${ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "${BUILDER_ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]

      - name: Configure short-lived AWS build credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-admin-build-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Resolve image metadata
        id: metadata
        run: |
          set -euo pipefail
          printf 'created=%s\n' "$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_OUTPUT}"

      - name: Ensure immutable dependency builder
        id: builder
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BUILDER_ECR_REPOSITORY: ${{ vars.BUILDER_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          output_file="${RUNNER_TEMP}/builder-image.env"
          scripts/docker/ensure-builder-image.sh \
            "${AWS_ACCOUNT_ID}" \
            "${AWS_REGION}" \
            "${BUILDER_ECR_REPOSITORY}" \
            "${output_file}"
          source "${output_file}"
          [[ "${BUILDER_IMAGE}" =~ @sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\n' "${BUILDER_IMAGE}" >>"${GITHUB_OUTPUT}"

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: scripts/docker/Dockerfile.admin-app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ADMIN_ECR_REPOSITORY }}:git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            BUILDER_IMAGE=${{ steps.builder.outputs.image }}
            APP_VERSION=${{ github.sha }}
            APP_REVISION=${{ github.sha }}
            APP_CREATED=${{ steps.metadata.outputs.created }}
            APP_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=idnest-admin-app
          cache-to: type=gha,mode=max,scope=idnest-admin-app
          provenance: mode=max
          sbom: true

      - name: Smoke-test pushed digest
        env:
          IMAGE_REF: ${{ steps.ecr.outputs.registry }}/${{ vars.ADMIN_ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_REF}" =~ @sha256:[a-f0-9]{64}$ ]]
          docker pull "${IMAGE_REF}"
          scripts/docker/smoke-test-admin-image.sh "${IMAGE_REF}"

  deploy:
    name: Deploy admin to development
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: development-admin
    concurrency:
      group: idnest-vps-development
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ needs.build.outputs.revision }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ vars.ADMIN_BOOTSTRAP_EMAILS }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          ADMIN_CSRF_SECRET: ${{ secrets.ADMIN_CSRF_SECRET }}
          ADMIN_OIDC_CLIENT_SECRET: ${{ secrets.ADMIN_OIDC_CLIENT_SECRET }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${REVISION}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${AWS_REGION}" =~ ^[a-z0-9-]+$ ]]
          [[ "${AWS_DEPLOY_ROLE_ARN}" == arn:aws:iam::${AWS_ACCOUNT_ID}:role/* ]]
          [[ "${ECR_REPOSITORY}" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "${VPS_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${VPS_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          [[ "${VPS_USER}" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]
          [[ -n "${ADMIN_BOOTSTRAP_EMAILS}" ]]
          [[ -n "${HOST_RELEASE_SIGNING_PRIVATE_KEY_B64}" ]]
          [[ -n "${AUTHZ_DATABASE_URL}" ]]
          [[ -n "${ADMIN_CSRF_SECRET}" ]]
          [[ -n "${ADMIN_OIDC_CLIENT_SECRET}" ]]
          [[ -n "${VPS_SSH_PRIVATE_KEY_B64}" && -n "${VPS_SSH_KNOWN_HOSTS_B64}" ]]

      - name: Configure short-lived AWS pull credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: idnest-admin-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Prepare SSH and release
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ADMIN_BOOTSTRAP_EMAILS: ${{ vars.ADMIN_BOOTSTRAP_EMAILS }}
          HOST_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.HOST_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
          AUTHZ_DATABASE_URL: ${{ secrets.AUTHZ_DATABASE_URL }}
          ADMIN_CSRF_SECRET: ${{ secrets.ADMIN_CSRF_SECRET }}
          ADMIN_OIDC_CLIENT_SECRET: ${{ secrets.ADMIN_OIDC_CLIENT_SECRET }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/idnest-ssh"
          printf '%s' "${VPS_SSH_PRIVATE_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/idnest-ssh/id_ed25519"
          printf '%s' "${VPS_SSH_KNOWN_HOSTS_B64}" | base64 --decode > "${RUNNER_TEMP}/idnest-ssh/known_hosts"
          printf '%s' "${HOST_RELEASE_SIGNING_PRIVATE_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/host-release-signing-private.pem"
          scripts/deploy/render-development-app-env.sh admin "${RUNNER_TEMP}/app.env"
          tar --create --gzip --file "${RUNNER_TEMP}/host-release.tar.gz" \
            scripts/deploy/vps/compose.auth.yaml \
            scripts/deploy/vps/compose.admin.yaml \
            scripts/deploy/vps/compose.idnest.yaml \
            scripts/deploy/vps/Dockerfile.kratos \
            scripts/deploy/vps/deploy-idnest-app.sh \
            scripts/deploy/vps/deploy-idnest-infra.sh \
            scripts/deploy/vps/deploy-idnest-auth.sh \
            scripts/deploy/vps/deploy-idnest-admin.sh \
            scripts/deploy/vps/rollback-idnest-app.sh \
            scripts/deploy/vps/rollback-idnest-auth.sh \
            scripts/deploy/vps/rollback-idnest-admin.sh \
            scripts/deploy/vps/validate-app-env.sh \
            scripts/deploy/vps/idnest-cloudflared.service \
            scripts/docker/render-kratos-config.sh
          openssl pkey -in "${RUNNER_TEMP}/host-release-signing-private.pem" -noout
          openssl pkeyutl -sign -rawin \
            -inkey "${RUNNER_TEMP}/host-release-signing-private.pem" \
            -in "${RUNNER_TEMP}/host-release.tar.gz" -out "${RUNNER_TEMP}/host-release.sig"
          openssl pkeyutl -sign -rawin \
            -inkey "${RUNNER_TEMP}/host-release-signing-private.pem" \
            -in "${RUNNER_TEMP}/app.env" -out "${RUNNER_TEMP}/app-env.sig"
          aws ecr get-login-password --region "${AWS_REGION}" > "${RUNNER_TEMP}/ecr-password"
          chmod 600 "${RUNNER_TEMP}/idnest-ssh/id_ed25519" "${RUNNER_TEMP}/idnest-ssh/known_hosts" \
            "${RUNNER_TEMP}/host-release.tar.gz" \
            "${RUNNER_TEMP}/app.env" "${RUNNER_TEMP}/app-env.sig" \
            "${RUNNER_TEMP}/host-release.sig" "${RUNNER_TEMP}/host-release-signing-private.pem" \
            "${RUNNER_TEMP}/ecr-password"

      - name: Upload release request inputs
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          scp_args=(
            -i "${RUNNER_TEMP}/idnest-ssh/id_ed25519"
            -P "${port}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${RUNNER_TEMP}/idnest-ssh/known_hosts"
          )
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for name in host-release.tar.gz host-release.sig app.env app-env.sig ecr-password; do
            scp "${scp_args[@]}" "${RUNNER_TEMP}/${name}" \
              "${VPS_USER}@${VPS_HOST}:/var/lib/idnest/queue/incoming/${name}.${request_id}.upload"
          done

      - name: Submit release and wait for root processor
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ needs.build.outputs.revision }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_ref="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          host_bundle_sha256=$(sha256sum "${RUNNER_TEMP}/host-release.tar.gz" | awk '{print $1}')
          app_env_sha256=$(sha256sum "${RUNNER_TEMP}/app.env" | awk '{print $1}')
          ssh_args=(
            -i "${RUNNER_TEMP}/idnest-ssh/id_ed25519"
            -p "${port}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${RUNNER_TEMP}/idnest-ssh/known_hosts"
          )
          ssh "${ssh_args[@]}" "${VPS_USER}@${VPS_HOST}" \
            /usr/local/bin/submit-idnest-release admin "${request_id}" "${GITHUB_RUN_ID}" \
            "${REVISION}" "${image_ref}" "${host_bundle_sha256}" "${app_env_sha256}"
          ssh "${ssh_args[@]}" "${VPS_USER}@${VPS_HOST}" \
            /usr/local/bin/wait-idnest-release admin "${request_id}" 2200

      - name: Remove runner-side sensitive files
        if: ${{ always() }}
        run: |
          rm -f "${RUNNER_TEMP}/app.env" "${RUNNER_TEMP}/app-env.sig"
          rm -f "${RUNNER_TEMP}/host-release.tar.gz" "${RUNNER_TEMP}/host-release.sig"
          rm -f "${RUNNER_TEMP}/host-release-signing-private.pem" "${RUNNER_TEMP}/ecr-password"
          rm -f "${RUNNER_TEMP}/idnest-ssh/id_ed25519" "${RUNNER_TEMP}/idnest-ssh/known_hosts"
